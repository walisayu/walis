server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma no-cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'self'" always;

    # For the container healthcheck; the app's own /health is the route below, which forwards to the API.
    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # The remote runner's artifact endpoint accepts up to 64 MiB of files plus 2 MiB of multipart overhead.
    # Raise nginx's default 1 MiB limit only for this exact route and stream straight to the API, so the 32 MiB tmpfs
    # is not filled by request buffering. The API/Kestrel and the streaming reader still each re-check the same byte budget.
    location ~ "^/api/builds/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/artifacts/?$" {
        client_max_body_size 66m;
        proxy_request_buffering off;
        proxy_pass http://walis-dev-api:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://walis-dev-api:8080;
        proxy_http_version 1.1;
        # Requests for build logs and artifacts may take longer than nginx's default 60 seconds.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://walis-dev-api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
